
services:

  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    image: mariadb
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MARIADB_ROOT_PASSWORD_FILE=/run/secrets/db_root_password
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "mariadb -u $$MYSQL_USER -p$$(cat /run/secrets/db_password) -D $$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
      container_name: nginx
      build: ./requirements/nginx
      image: nginx
      ports:
        - "443:443"
      networks:
        - inception_network
      volumes:
        - wordpress_data:/var/www/html:ro
        - static_site_data:/var/www/static:ro
      environment:
        - DOMAIN_NAME=${DOMAIN_NAME}
      depends_on:
        wordpress:
          condition: service_healthy
      restart: always
      healthcheck:
        test: ["CMD", "nc", "-z", "localhost", "443"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 10s

  redis:
    container_name: redis
    build: ./requirements/bonus/redis-cache
    image: redis
    networks:
      - inception_network
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    image: wordpress
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: always
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm83"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

  ftp:
    container_name: ftp
    build: ./requirements/bonus/ftp-server
    image: ftp
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - ftp_user_password
    ports:
      - "21:21"
      - "21000-21010:21000-21010"
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      - FTP_USER=${FTP_USER:-ftpuser}
    restart: always
    healthcheck:
      test: ["CMD", "pgrep", "vsftpd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  adminer:
    container_name: adminer
    build: ./requirements/bonus/adminer
    image: adminer
    networks:
      - inception_network
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress

  static_site_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/static-site

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt
