
services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    restart: always
    healthcheck:
      test: ["CMD", "mariadb", "-u", "${MYSQL_USER}", "-p$$(cat /run/secrets/db_password)", "-D", "${MYSQL_DATABASE}", "-e", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
      container_name: nginx
      build: ./requirements/nginx
      ports:
        - "443:443"
      networks:
        - inception_network
      volumes:
        - wordpress_data:/var/www/html:ro
        - static_site_data:/var/www/static:ro
      environment:
        - DOMAIN_NAME=${DOMAIN_NAME}
      depends_on:
        wordpress:
          condition: service_healthy
      restart: always
      healthcheck:
        test: ["CMD", "nc", "-z", "localhost", "443"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 10s

  wordpress:
    container_name: wordpress
    build: ./requirements/wordpress
    networks:
      - inception_network
    volumes:
      - wordpress_data:/var/www/html
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - WP_ADMIN_USER=${WP_ADMIN_USER}
      - WP_ADMIN_EMAIL=${WP_ADMIN_EMAIL}
      - WP_USER=${WP_USER}
      - WP_USER_EMAIL=${WP_USER_EMAIL}
    restart: always
    healthcheck:
      test: ["CMD", "pgrep", "php-fpm"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

  wordpress_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress

  static_site_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/static-site

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
