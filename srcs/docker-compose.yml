
services:
  mariadb:
    container_name: mariadb
    build: ./requirements/mariadb
    networks:
      - inception_network
    volumes:
      - mariadb_data:/var/lib/mysql
    secrets:
      - db_root_password
      - db_password
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
    restart: always
  nginx:
      container_name: nginx
      build: ./requirements/nginx
      ports:
        - "443:443"
      networks:
        - inception_network
      volumes:
        - wordpress_data:/var/www/html:ro
      depends_on:
        - wordpress
      restart: always

networks:
  inception_network:
    driver: bridge

volumes:
  mariadb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ~/data/mariadb

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_password:
    file: ../secrets/db_password.txt
