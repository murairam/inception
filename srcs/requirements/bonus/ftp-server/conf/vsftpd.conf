# Run in foreground (no daemon mode - proper PID 1)
background=NO

# Listen on IPv4
listen=YES
listen_ipv6=NO

# Disable anonymous FTP
anonymous_enable=NO

# Enable local users
local_enable=YES

# Enable write commands
write_enable=YES

# Set local umask
local_umask=022

# Enable chroot for security
chroot_local_user=YES
allow_writeable_chroot=YES

# Passive mode configuration
pasv_enable=YES
pasv_min_port=21000
pasv_max_port=21010
pasv_address=0.0.0.0

# Security settings
seccomp_sandbox=NO
ssl_enable=NO

# Logging
xferlog_enable=YES
xferlog_std_format=YES
log_ftp_protocol=YES

# User list settings
userlist_enable=NO

# Hide IDs from user
hide_ids=YES

# Connection settings
max_clients=10
max_per_ip=5

# Timeout settings
idle_session_timeout=600
data_connection_timeout=120
