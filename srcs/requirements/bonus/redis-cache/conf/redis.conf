# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# Bind to all interfaces so WordPress container can connect
bind 0.0.0.0

# Default Redis port
port 6379

# Disable protected mode (safe in Docker internal network)
protected-mode no


# ============================================================================
# GENERAL
# ============================================================================

# Run in foreground (CRITICAL for Docker - container must not daemonize)
daemonize no

# PID file location
pidfile /var/run/redis.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log to stdout (Docker captures this)
logfile ""


# ============================================================================
# PERSISTENCE (DISABLED - Cache is ephemeral)
# ============================================================================

# Disable RDB snapshots (no save to disk)
save ""

# Disable AOF (append-only file)
appendonly no


# ============================================================================
# MEMORY MANAGEMENT
# ============================================================================

# Maximum memory Redis can use (prevents unlimited growth)
maxmemory 256mb

# Eviction policy when maxmemory is reached
# allkeys-lru = Remove least recently used keys from all keys
maxmemory-policy allkeys-lru


# ============================================================================
# WORKING DIRECTORY
# ============================================================================

# Directory where Redis will write (even though we disabled persistence)
dir /data
